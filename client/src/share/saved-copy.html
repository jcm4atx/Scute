<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Saved copy</title>
<style>
:root{--bg:#f6f3ee;--panel:#fffdf9;--fg:#23201c;--muted:#6f685e;--line:#e3ddd3;--accent:#2f6b52;--accent-fg:#fff;--err:#a3402e;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#171513;--panel:#201d1a;--fg:#ece6dc;--muted:#a39b8f;--line:#35302a;--accent:#6fb594;--accent-fg:#10201a;--err:#e08a76}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
#app{min-height:100%;display:flex;flex-direction:column}
a{color:var(--accent)}
.muted{color:var(--muted)}
.center{flex:1;display:grid;place-items:center;padding:24px}
.card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.card h1{font-size:18px;margin:0;font-weight:600;word-break:break-word}
.card p{margin:0;color:var(--muted)}
.badge{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
input{width:100%;font:inherit;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button,.btn{font:inherit;font-size:14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--fg);text-decoration:none;cursor:pointer;white-space:nowrap}
button.primary,.btn.primary,form .primary{background:var(--accent);color:var(--accent-fg);border-color:transparent;width:100%}
.btn.ghost{background:transparent}
button:disabled{opacity:.6;cursor:default}
.err{color:var(--err)!important;min-height:1.2em;font-size:14px}
.bar{width:100%;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.top{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.mark{color:var(--accent);display:grid;place-items:center;flex:none}
.titles{flex:1;min-width:0}
.titles h1{font-size:15px;margin:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titles p{margin:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:8px;flex:none}
.stage{flex:1;display:flex;min-height:0}
.stage.page{background:#fff}
.stage.page iframe{flex:1;border:0;width:100%;min-height:calc(100dvh - 100px)}
.stage.media{align-items:center;justify-content:center;padding:18px;background:color-mix(in srgb,var(--bg) 70%,#000 30%)}
.stage.media img{max-width:100%;max-height:calc(100dvh - 130px);object-fit:contain;cursor:zoom-in;border-radius:4px}
.stage.media img.actual{max-width:none;max-height:none;cursor:zoom-out}
.stage.media:has(img.actual){overflow:auto;align-items:flex-start;justify-content:flex-start}
.stage.media video{max-width:100%;max-height:calc(100dvh - 130px);background:#000;border-radius:6px}
.stage.scroll{overflow:auto}
.text{margin:0;padding:24px;white-space:pre-wrap;word-break:break-word;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}
.foot{padding:10px 18px;font-size:12px;color:var(--muted);text-align:center;border-top:1px solid var(--line)}
@media (max-width:640px){.top{flex-wrap:wrap;padding:10px 12px}.actions{width:100%}.actions .btn{flex:1}.titles h1{white-space:normal}}
</style>
</head>
<body>
<div id="app"><main class="center"><p class="muted">Loading…</p></main></div>
<noscript><p style="text-align:center">This page needs JavaScript to decrypt the shared copy.</p></noscript>
<script>/*SCRIPT*/</script>
</body>
</html>
